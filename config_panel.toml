version = "1.0"

[main]
name.fr = "Liaison ARCenal"
name.en = "ARCenal connection"

    [main.connection]
    name.fr = "Connexion QSSE"
    name.en = "QSSE connection"
        [main.connection.portal_app]
        ask.fr = "Portail équipier"
        ask.en = "Employee portal"
        type = "app"
        [main.connection.dolibarr_app]
        ask.fr = "Dolibarr QSSE"
        ask.en = "QSSE Dolibarr"
        type = "app"
        [main.connection.gateway_url]
        ask.fr = "URL HTTPS de la passerelle"
        ask.en = "Gateway HTTPS URL"
        type = "url"
        [main.connection.pairing_code]
        ask.fr = "Nouveau code d’appairage temporaire"
        ask.en = "New temporary pairing code"
        type = "password"
        bind = "null"
        help.fr = "Saisissez un code nouvellement créé dans ARCenal QSSE uniquement pour reconnecter le portail."
        help.en = "Enter a newly generated ARCenal QSSE code only to reconnect the portal."

    [main.actions]
    name.fr = "Actions"
    name.en = "Actions"
        [main.actions.apply_pairing]
        ask.fr = "Connecter ou réparer la liaison"
        ask.en = "Connect or repair the connection"
        type = "button"
        style = "success"
        [main.actions.test_connection]
        ask.fr = "Vérifier la liaison"
        ask.en = "Check connection"
        type = "button"
        [main.actions.detach]
        ask.fr = "Déconnecter la liaison"
        ask.en = "Disconnect"
        type = "button"
        style = "danger"
